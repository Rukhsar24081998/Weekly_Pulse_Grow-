name: Weekly Pulse

on:
  schedule:
    # Monday 09:00 IST (03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      use_groq:
        description: "Use Groq for theme clustering (may hit rate limits)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish:
        description: "Publish to Google Doc + Gmail draft via MCP"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      PUBLISH_GOOGLE_DOC_ID: ${{ secrets.PUBLISH_GOOGLE_DOC_ID }}
      DRAFT_RECIPIENT: ${{ secrets.DRAFT_RECIPIENT }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Fetch public store reviews
        run: python scripts/fetch_public_reviews.py --weeks 12

      - name: Phase 1 — ingest
        run: python -m src.ingest.run --weeks 12

      - name: Phase 2 — themes
        run: |
          if [ "${{ github.event.inputs.use_groq || 'false' }}" = "true" ]; then
            python -m src.themes.run
          else
            python -m src.themes.run --no-groq
          fi

      - name: Phase 3 — pulse
        run: python -m src.pulse.run

      - name: Validate pulse
        run: python -m src.guardrails.validate phases/phase-3/pulse.md

      - name: Phase 4+5 — publish via MCP
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        continue-on-error: true
        run: python -m src.publish.e2e_run

      - name: Phase 6 — sign-off report
        continue-on-error: true
        run: python scripts/phase6_signoff.py --require-artifacts

      - name: Sync pulse data to public API (Render)
        continue-on-error: true
        env:
          PUBLIC_PULSE_API_URL: ${{ secrets.PUBLIC_PULSE_API_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        if: env.PUBLIC_PULSE_API_URL != '' && env.SYNC_SECRET != ''
        run: python scripts/sync_public_api.py

      - name: Publish dashboard snapshot for Vercel
        run: python scripts/export_dashboard_data.py

      - name: Commit dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/pulse-latest.json frontend/public/data/status.json
          if git diff --cached --quiet; then
            echo "No dashboard snapshot changes"
            exit 0
          fi
          git commit -m "Update public dashboard snapshot"
          git push

      - name: Upload pulse artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pulse-${{ github.run_id }}
          retention-days: 30
          path: |
            phases/phase-3/pulse.md
            phases/phase-3/pulse.json
            phases/phase-4/doc_metadata.json
            phases/phase-5/run.json
            phases/phase-6/signoff_report.json
